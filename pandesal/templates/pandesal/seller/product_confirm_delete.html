{% extends 'pandesal/seller/seller_base.html' %}

{% block title %}Delete Product - Seller Dashboard{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow border border-gray-100 mt-10">
  <div class="text-center">
    <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100 mb-6">
      <i class="fas fa-exclamation-triangle text-red-600 text-2xl"></i>
    </div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Delete Product</h1>
    <p class="text-gray-600 mb-8">Are you sure you want to delete the product <strong class="text-gray-800">"{{ product.name }}"</strong>? This action cannot be undone.</p>
    
    <form method="POST" class="flex justify-center gap-4">
      {% csrf_token %}
      <a href="{% url 'seller_products' %}" class="px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium rounded transition">
        Cancel
      </a>
      <button type="submit" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-medium rounded transition shadow">
        Yes, Delete Product
      </button>
    </form>
  </div>
</div>
{% endblock %}
