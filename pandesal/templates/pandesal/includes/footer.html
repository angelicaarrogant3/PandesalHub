{% load static %}
<!-- Minimalist Footer -->
<footer class="bg-[#14271d] text-white py-6 mt-auto border-t border-gray-800 relative z-10">
  <div class="max-w-[1360px] mx-auto px-6 lg:px-10">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
      
      <!-- Brand & Description -->
      <div class="flex items-center gap-4 text-center md:text-left">
        <img src="{% static 'pandesal/img/pandesalhub_icon.png' %}" alt="Logo" class="w-8 h-8 rounded-full border border-gray-600">
        <div>
          <h4 class="text-base font-bold tracking-wide">PandesalHub</h4>
          <p class="text-gray-400 text-xs">Information Management & Entrepreneurial Mind Project</p>
        </div>
      </div>

      <!-- Developers -->
      <div class="text-center md:text-right">
        <h5 class="text-xs font-semibold text-green-400 uppercase tracking-widest mb-1">Developed By</h5>
        <p class="text-gray-300 text-xs flex flex-wrap justify-center md:justify-end gap-3">
          <span><i class="fas fa-user-graduate text-green-500 mr-1"></i> A. Arrogante</span>
          <span><i class="fas fa-user-graduate text-green-500 mr-1"></i> J. Bohol</span>
          <span><i class="fas fa-user-graduate text-green-500 mr-1"></i> J. Roldan</span>
        </p>
      </div>

    </div>
    
    <!-- Copyright -->
    <div class="text-center text-gray-500 text-[10px] mt-4 pt-4 border-t border-gray-800">
      &copy; {% now "Y" %} PandesalHub. All rights reserved.
    </div>
  </div>
</footer>
