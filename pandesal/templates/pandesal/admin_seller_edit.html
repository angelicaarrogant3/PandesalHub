{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% include "pandesal/includes/seo_meta.html" %}
    <script src="{% static 'pandesal/js/tailwind.js' %}"></script>
    <link rel="stylesheet" href="{% static 'pandesal/css/fontawesome/all.min.css' %}" />
    <link rel="icon" href="{% static 'pandesal/img/pandesalhub_icon.png' %}" type="image/png">
</head>
<body class="bg-green-50">

<div class="w-full overflow-x-hidden overflow-y-auto">
    <div class="p-6">
        <div class="bg-white rounded-lg shadow">
            <div class="p-6">
                <form id="editSellerForm" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div id="formAlert" class="hidden mb-4 px-4 py-3 rounded-md text-sm font-medium"></div>
                    
                    <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                        <i class="fas fa-store text-green-600"></i> Edit Seller & Bakery Details
                    </h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="shop_name" class="block text-sm font-medium text-gray-700 mb-2">Shop Name *</label>
                            <input type="text" name="shop_name" id="shop_name" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500"
                                   value="{{ shop.shop_name }}">
                        </div>

                        <div>
                            <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username *</label>
                            <input type="text" name="username" id="username" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500"
                                   value="{{ seller_user.username }}">
                        </div>

                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
                            <input type="email" name="email" id="email" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500"
                                   value="{{ seller_user.email }}">
                        </div>

                        <div>
                            <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
                            <input type="text" name="phone" id="phone"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500"
                                   value="{{ profile.phone|default:'' }}">
                        </div>

                        <div>
                            <label for="first_name" class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
                            <input type="text" name="first_name" id="first_name"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500"
                                   value="{{ seller_user.first_name }}">
                        </div>

                        <div>
                            <label for="last_name" class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
                            <input type="text" name="last_name" id="last_name"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500"
                                   value="{{ seller_user.last_name }}">
                        </div>

                        <div class="md:col-span-2">
                            <label for="password1" class="block text-sm font-medium text-gray-700 mb-2">New Password (leave blank to keep current)</label>
                            <input type="password" name="password1" id="password1" minlength="8"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500">
                        </div>
                    </div>

                    <div class="mt-8 flex justify-end">
                        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-md font-semibold shadow">
                            Update Seller Account
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('editSellerForm');
    if (!form) return;

    const alertBox = document.getElementById('formAlert');

    function showAlert(message, type) {
      if (!alertBox) return;
      const variant = type === 'success' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-red-100 text-red-700 border-red-200';
      alertBox.className = `mb-4 px-4 py-3 rounded-md text-sm font-medium border ${variant}`;
      alertBox.textContent = message;
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      const formData = new FormData(form);

      fetch(window.location.href, {
        method: 'POST',
        headers: { 'X-Requested-With': 'XMLHttpRequest' },
        body: formData,
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          showAlert(data.message || 'Seller updated successfully.', 'success');
          if (window.parent) {
            window.parent.postMessage({ type: 'sellerUpdated', message: data.message }, '*');
          }
        } else {
          showAlert(data.error || 'Failed to update seller.', 'error');
        }
      })
      .catch(() => showAlert('An error occurred while updating.', 'error'));
    });
  });
</script>
</body>
</html>
