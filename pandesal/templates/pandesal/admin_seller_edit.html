{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include "pandesal/includes/seo_meta.html" %}
    <script src="{% static 'pandesal/js/tailwind.js' %}"></script>
    <link rel="stylesheet" href="{% static 'pandesal/css/fontawesome/all.min.css' %}" />
    <link rel="icon" href="{% static 'pandesal/img/pandesalhub_icon.png' %}" type="image/png">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#16a34a',
              secondary: '#15803d',
              sage: '#E7EFE9',
              ink: '#1D3B33',
              tealsoft: '#2E5E51',
            }
          }
        }
      }
    </script>
    <style>
      .field {
        width: 100%;
        border: 1px solid #E2E8F0;
        border-radius: 0.9rem;
        padding: 0.625rem 0.9rem;
        font-size: 0.875rem;
        color: #1F2937;
        background: #fff;
        transition: box-shadow .15s ease, border-color .15s ease;
      }
      .field:focus { outline: none; border-color: transparent; box-shadow: 0 0 0 2px rgba(46, 94, 81, 0.35); }
      .field-label { display: block; font-size: 0.8125rem; font-weight: 600; color: #374151; margin-bottom: 0.4rem; }
    </style>
</head>
<body class="bg-[#F1F5F2]">

<div class="max-w-3xl mx-auto p-5 lg:p-6">
    <form id="editSellerForm" method="POST" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}
        <div id="formAlert" class="hidden mb-4 px-4 py-3 rounded-2xl text-sm font-medium"></div>

        <!-- Shop & Account -->
        <div class="bg-white rounded-3xl shadow-sm p-6">
            <div class="flex items-center gap-2 mb-5">
                <span class="inline-flex h-9 w-9 items-center justify-center rounded-2xl bg-sage text-tealsoft"><i class="fas fa-store"></i></span>
                <h3 class="text-base font-semibold text-ink">Bakery &amp; Account Details</h3>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="md:col-span-2">
                    <label for="shop_name" class="field-label">Shop Name <span class="text-red-500">*</span></label>
                    <input type="text" name="shop_name" id="shop_name" required class="field" value="{{ shop.shop_name }}">
                </div>
                <div>
                    <label for="username" class="field-label">Username <span class="text-red-500">*</span></label>
                    <input type="text" name="username" id="username" required class="field" value="{{ seller_user.username }}">
                </div>
                <div>
                    <label for="email" class="field-label">Email <span class="text-red-500">*</span></label>
                    <input type="email" name="email" id="email" required class="field" value="{{ seller_user.email }}">
                </div>
                <div>
                    <label for="first_name" class="field-label">First Name</label>
                    <input type="text" name="first_name" id="first_name" class="field" value="{{ seller_user.first_name }}">
                </div>
                <div>
                    <label for="last_name" class="field-label">Last Name</label>
                    <input type="text" name="last_name" id="last_name" class="field" value="{{ seller_user.last_name }}">
                </div>
                <div class="md:col-span-2">
                    <label for="phone" class="field-label">Phone Number</label>
                    <input type="text" name="phone" id="phone" class="field" value="{{ profile.phone|default:'' }}">
                </div>
            </div>
        </div>

        <!-- Security -->
        <div class="bg-white rounded-3xl shadow-sm p-6">
            <div class="flex items-center gap-2 mb-5">
                <span class="inline-flex h-9 w-9 items-center justify-center rounded-2xl bg-sage text-tealsoft"><i class="fas fa-lock"></i></span>
                <h3 class="text-base font-semibold text-ink">Security</h3>
            </div>
            <div>
                <label for="password1" class="field-label">New Password <span class="text-xs font-normal text-gray-400">(leave blank to keep current)</span></label>
                <input type="password" name="password1" id="password1" minlength="8" class="field" placeholder="Optional — enter only to change">
            </div>
        </div>

        <!-- Actions -->
        <div class="flex justify-end gap-3 pt-1">
            <button type="submit" class="px-6 py-2.5 rounded-2xl bg-ink hover:bg-tealsoft text-white font-medium shadow transition flex items-center">
                <i class="fas fa-check mr-2"></i>Update Seller Account
            </button>
        </div>
    </form>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('editSellerForm');
    if (!form) return;

    const alertBox = document.getElementById('formAlert');
    const alertBaseClasses = 'mb-4 px-4 py-3 rounded-2xl text-sm font-medium';

    function showAlert(message, type) {
      if (!alertBox) return;
      const variant = type === 'success' ? ' bg-green-100 text-green-700 border border-green-200' : ' bg-red-100 text-red-700 border border-red-200';
      alertBox.className = `${alertBaseClasses}${variant}`;
      alertBox.textContent = message;
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      const formData = new FormData(form);

      fetch(window.location.href, {
        method: 'POST',
        headers: { 'X-Requested-With': 'XMLHttpRequest' },
        body: formData,
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          showAlert(data.message || 'Seller updated successfully.', 'success');
          if (window.parent) {
            window.parent.postMessage({ type: 'sellerUpdated', message: data.message }, '*');
          }
        } else {
          showAlert(data.error || 'Failed to update seller.', 'error');
        }
      })
      .catch(() => showAlert('An error occurred while updating.', 'error'));
    });
  });
</script>
</body>
</html>
